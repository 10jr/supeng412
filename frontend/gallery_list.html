<!DOCTYPE html>
<!--
  姓名：苏鹏 | 学号：24002120412
  时间：2026-11-20 | 大模型：DeepSeek-V4.1-Flash
  功能：图文列表页，展示后端接口链接与数据库中的图文数据
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图文列表 | 校园二手集市</title>
  <link rel="stylesheet" href="css/sp_common.css">
  <link rel="stylesheet" href="css/sp_news.css">
  <link rel="stylesheet" href="css/sp_gallery.css">
</head>
<body class="sp_body">
  <canvas id="sp_canvas" class="sp_canvas"></canvas>
  <div class="sp_orb sp_orb_a"></div>
  <div class="sp_orb sp_orb_b"></div>

  <div class="sp_page">
    <main class="sp_shell sp_main">
      <div class="sp_page_head">
        <div>
          <h1 class="sp_page_title">图文列表</h1>
          <p class="sp_page_desc" id="sp_gallerySummary">正在加载图文…</p>
        </div>
        <a class="sp_btn sp_btn_ghost" href="index.html">返回首页</a>
      </div>

      <div class="sp_info_bar" id="sp_infoBar">
        <div class="sp_info_item">
          <span class="sp_info_label">接口地址</span>
          <span class="sp_info_value">
            <code class="sp_api_method">GET</code>
            <a class="sp_api_link" id="sp_apiLink" href="/api/gallery" target="_blank" rel="noopener">/api/gallery</a>
          </span>
        </div>
        <div class="sp_info_item">
          <span class="sp_info_label">数据表</span>
          <span class="sp_info_value sp_info_code" id="sp_infoTable">sp_gallery</span>
        </div>
        <div class="sp_info_item">
          <span class="sp_info_label">数据量</span>
          <span class="sp_info_value">共 <strong id="sp_infoCount">0</strong> 条图文</span>
        </div>
      </div>

      <div class="sp_gallery_grid" id="sp_galleryGrid"></div>
    </main>

    <footer class="sp_shell sp_foot">
      <span>© 2026 苏鹏 · 24002120412</span>
      <span>数据来源：MySQL 表 sp_gallery</span>
    </footer>
  </div>

  <script src="js/sp_common.js"></script>
  <script src="js/sp_background.js"></script>
  <script src="js/sp_gallery_list.js"></script>
</body>
</html>
