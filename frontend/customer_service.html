<!DOCTYPE html>
<!--
  姓名：苏鹏 | 学号：24002120412
  时间：2026-11-25 | 大模型：DeepSeek-V4.1-Flash
  功能：在线客服页，基于硅基流动大模型接口实现多轮对话问答
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>在线客服 | 校园二手集市</title>
  <link rel="stylesheet" href="css/sp_common.css">
  <link rel="stylesheet" href="css/sp_customer_service.css">
</head>
<body class="sp_body">
  <canvas id="sp_canvas" class="sp_canvas"></canvas>
  <div class="sp_orb sp_orb_a"></div>
  <div class="sp_orb sp_orb_b"></div>

  <div class="sp_page">
    <main class="sp_shell sp_main">
      <div class="sp_page_head">
        <div>
          <h1 class="sp_page_title">在线客服</h1>
          <p class="sp_page_desc">校园二手集市智能客服，由硅基流动大模型提供回答</p>
        </div>
        <a class="sp_btn sp_btn_ghost" href="index.html">返回首页</a>
      </div>

      <div class="sp_info_bar">
        <div class="sp_info_item">
          <span class="sp_info_label">接口地址</span>
          <span class="sp_info_value">
            <code class="sp_api_method">POST</code>
            <a class="sp_api_link" id="sp_apiLink" href="/api/ai/chat" target="_blank" rel="noopener">/api/ai/chat</a>
          </span>
        </div>
        <div class="sp_info_item">
          <span class="sp_info_label">服务商</span>
          <span class="sp_info_value sp_info_code" id="sp_providerText">硅基流动</span>
        </div>
        <div class="sp_info_item">
          <span class="sp_info_label">模型</span>
          <span class="sp_info_value sp_info_code" id="sp_modelText">加载中…</span>
        </div>
      </div>

      <section class="sp_chat_card">
        <div class="sp_chat_toolbar">
          <span class="sp_chat_status"><i class="sp_dot"></i><span id="sp_chatStatus">客服在线，随时为你解答</span></span>
          <button class="sp_btn sp_btn_ghost sp_btn_sm" type="button" id="sp_clearBtn">清空对话</button>
        </div>

        <div class="sp_chat_body" id="sp_chatBody" aria-live="polite"></div>

        <div class="sp_chat_quick" id="sp_quickBox">
          <button class="sp_quick_btn" type="button" data-sp-question="怎么发布一件闲置商品？">怎么发布商品？</button>
          <button class="sp_quick_btn" type="button" data-sp-question="商品卖出后如何标记为已售出？">如何标记已售出？</button>
          <button class="sp_quick_btn" type="button" data-sp-question="校园内面交需要注意哪些安全事项？">面交安全建议</button>
        </div>

        <form class="sp_chat_input" id="sp_chatForm">
          <textarea class="sp_chat_textarea" id="sp_chatInput" rows="2" maxlength="500"
            placeholder="请输入你的问题，Enter 发送，Shift + Enter 换行"></textarea>
          <button class="sp_btn sp_btn_primary" type="submit" id="sp_sendBtn">发送</button>
        </form>
      </section>
    </main>

    <footer class="sp_shell sp_foot">
      <span>© 2026 苏鹏 · 24002120412</span>
      <span>AI 服务：硅基流动 · 回答仅供参考</span>
    </footer>
  </div>

  <script src="js/sp_common.js"></script>
  <script src="js/sp_background.js"></script>
  <script src="js/sp_customer_service.js"></script>
</body>
</html>
